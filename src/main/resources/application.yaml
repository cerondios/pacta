spring:
  application:
    name: pacta-app

  datasource:
    driver-class-name: org.postgresql.Driver

  jackson:
    property-naming-strategy: SNAKE_CASE

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:change-me}
            client-secret: ${GOOGLE_CLIENT_SECRET:change-me}
            scope: openid,profile,email

server:
  port: ${PORT:8080}

# Keep Micrometer/MeterRegistry for custom metrics, but expose no HTTP endpoints.
management:
  endpoints:
    web:
      exposure:
        exclude: "*"

wompi:
  base-url: ${WOMPI_BASE_URL:https://sandbox.wompi.co/v1}
  public-key: ${WOMPI_PUBLIC_KEY:}
  private-key: ${WOMPI_PRIVATE_KEY:}
  events-key: ${WOMPI_EVENTS_KEY:}
  integrity-secret: ${WOMPI_INTEGRITY_SECRET:}

pacta:
  super-admin:
    email: ${SUPER_USER_MAIL}
    password: ${SUPER_USER_PASSWORD}
  metrics:
    template: "pacta.default.%s"
  security:
    jwt:
      # HMAC-SHA256 secret. MUST be >= 32 chars. Override in every real env.
      secret: ${JWT_SECRET}
      ttl-seconds: ${JWT_TTL_SECONDS:3600}
    code:
      # Lifetime of the one-time login code emailed to users.
      ttl-seconds: ${LOGIN_CODE_TTL_SECONDS:600}