events {
    worker_connections 1024;
}

http {

    upstream pacta_app {
        server app:8080;
    }

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name api.pacta.app;   # ← replace with your domain

        ssl_certificate     /etc/letsencrypt/live/api.pacta.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.pacta.app/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass         http://pacta_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
