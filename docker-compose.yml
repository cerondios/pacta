services:
  postgres:
    image: postgres:16-alpine
    container_name: pacta-postgres
    environment:
      POSTGRES_DB: pacta
      POSTGRES_USER: pacta
      POSTGRES_PASSWORD: pacta
    ports:
      - "5432:5432"
    volumes:
      - pacta_pgdata:/var/lib/postgresql/data

volumes:
  pacta_pgdata:
