name: Docker Image CI

on:
  push:
    tags:
      - "*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pacta-app:${{ github.ref_name }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push        # ← waits for build-and-push to finish first

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull cerondios/pacta-app:${{ github.ref_name }}

            docker stop $(docker ps -q) || true
            docker rm $(docker ps -aq) || true

            docker run -d \
              --name pacta-app \
              --restart unless-stopped \
              -p 80:8080 \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_REGION=${{ secrets.AWS_REGION }} \
              -e AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
              -e GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e JWT_TTL_SECONDS=${{ secrets.JWT_TTL_SECONDS }} \
              -e LOGIN_CODE_TTL_SECONDS=${{ secrets.LOGIN_CODE_TTL_SECONDS }} \
              -e MAIL_FROM=${{ secrets.MAIL_FROM }} \
              -e MAIL_HOST=${{ secrets.MAIL_HOST }} \
              -e MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }} \
              -e MAIL_PORT=${{ secrets.MAIL_PORT }} \
              -e MAIL_USERNAME=${{ secrets.MAIL_USERNAME }} \
              -e OTEL_LOGS_EXPORTER=none \
              -e OTEL_METRICS_EXPORTER=none \
              -e OTEL_TRACES_EXPORTER=none \
              -e SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }} \
              -e SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }} \
              -e SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }} \
              -e SPRING_PROFILES_ACTIVE=dev \
              cerondios/pacta-app:${{ github.ref_name }}
